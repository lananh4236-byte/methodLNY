<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Method Studio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-hover: #0284c7;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: #30363d;
            --success-color: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            line-height: 1.4;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            padding: 2.5rem 1rem;
            background: rgba(13, 17, 23, 0.5);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .upload-area:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .upload-text {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 6px;
        }

        input[type="file"] {
            display: none;
        }

        .file-preview {
            margin-top: 1.2rem;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--accent-blue);
            word-break: break-all;
            display: none;
            text-align: left;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-hover));
            color: #0d1117;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .status-box {
            margin-top: 1.2rem;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.4;
            text-align: left;
        }

        .loading {
            background: rgba(234, 179, 8, 0.1);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .success {
            background: rgba(63, 185, 80, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">TERMUX LOCAL ENGINE</span>
        <h1>Anime Method Studio</h1>
        <p class="description">Công cụ tối ưu hóa chất lượng Video TikTok chuẩn Anime Method</p>

        <div class="upload-area" onclick="document.getElementById('videoFile').click()">
            <span class="upload-icon">🎬</span>
            <div class="upload-text">Bấm để tải video lên</div>
            <div class="upload-hint">Hỗ trợ các định dạng .mp4, .mov</div>
            <input type="file" id="videoFile" accept="video/*" onchange="handleFileSelect()">
        </div>

        <div id="filePreview" class="file-preview"></div>

        <button class="btn-submit" onclick="runMethod()">Bắt Đầu Phân Giải Method</button>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        function handleFileSelect() {
            const input = document.getElementById('videoFile');
            const preview = document.getElementById('filePreview');
            
            if (input.files.length > 0) {
                const file = input.files[0];
                const fileSize = (file.size / (1024 * 1024)).toFixed(2);
                preview.style.display = 'block';
                preview.innerHTML = `📄 <strong>Tên file:</strong> ${file.name}<br>📊 <strong>Dung lượng:</strong> ${fileSize} MB`;
            }
        }

        function runMethod() {
            const input = document.getElementById('videoFile');
            const statusBox = document.getElementById('statusBox');

            if (input.files.length === 0) {
                alert("Vui lòng chọn video trước khi thực hiện!");
                return;
            }

            statusBox.className = "status-box loading";
            statusBox.style.display = "block";
            statusBox.innerHTML = "⏳ <strong>Đang xử lý:</strong> Termux Engine đang chạy lệnh tối ưu video...";

            // Giả lập phản hồi xem trước giao diện
            setTimeout(() => {
                statusBox.className = "status-box success";
                statusBox.innerHTML = "✨ <strong>Thành công:</strong> Giao diện hoạt động hoàn hảo!";
            }, 1500);
        }
    </script>
</body>
</html>

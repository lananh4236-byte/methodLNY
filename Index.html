<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Method Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #14161f;
            border: 1px solid #232733;
            border-radius: 20px;
            padding: 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }
        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: #fff; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .drop-zone {
            border: 2px dashed #2d3748;
            border-radius: 12px;
            padding: 24px 16px;
            cursor: pointer;
            background: #1a1d29;
            margin-bottom: 16px;
        }
        .file-info { font-size: 13px; font-weight: 600; color: #e2e8f0; word-break: break-all; }
        input[type="file"] { display: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #6366f1;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { background: #2d3748; color: #718096; cursor: not-allowed; }
        #statusMessage { margin-top: 15px; font-size: 13px; color: #fbbf24; }
        .download-btn {
            display: none;
            margin-top: 14px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">TERMUX LOCAL ENGINE</span>
        <h1>Anime Method Studio</h1>
        <p class="subtitle">Trình tối ưu hóa video trực tuyến</p>

        <div class="drop-zone" onclick="document.getElementById('videoInput').click()">
            <div style="font-size: 30px; margin-bottom: 6px;">🎬</div>
            <div class="file-info" id="fileNameText">Bấm vào đây để chọn file video (.mp4)</div>
        </div>
        <input type="file" id="videoInput" accept="video/mp4,video/quicktime">

        <button class="btn" id="processBtn" disabled>Bắt đầu tối ưu</button>
        <p id="statusMessage"></p>
        <a id="downloadBtn" class="download-btn">Tải Video Đã Tối Ưu</a>
    </div>

    <!-- Sử dụng phiên bản FFmpeg ổn định qua CDN dự phòng -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        let ffmpeg = null;
        let selectedFile = null;

        const videoInput = document.getElementById('videoInput');
        const fileNameText = document.getElementById('fileNameText');
        const processBtn = document.getElementById('processBtn');
        const statusMessage = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        videoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameText.innerText = `${selectedFile.name} (${(selectedFile.size / (1024*1024)).toFixed(2)} MB)`;
                processBtn.disabled = false;
                downloadBtn.style.display = 'none';
                statusMessage.innerText = "";
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            try {
                processBtn.disabled = true;
                downloadBtn.style.display = 'none';
                statusMessage.innerText = "Đang khởi tạo bộ công cụ...";

                if (!ffmpeg) {
                    ffmpeg = createFFmpeg({ log: true });
                }

                if (!ffmpeg.isLoaded()) {
                    statusMessage.innerText = "Đang tải Engine (Có thể mất vài giây lần đầu)...";
                    await ffmpeg.load();
                }

                statusMessage.innerText = "Đang đọc file video...";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

                statusMessage.innerText = "Đang xử lý tối ưu cấu trúc video...";
                await ffmpeg.run('-i', 'input.mp4', '-c', 'copy', '-movflags', '+faststart', 'output.mp4');

                statusMessage.innerText = "Đang xuất file...";
                const data = ffmpeg.FS('readFile', 'output.mp4');
                
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                downloadBtn.href = url;
                downloadBtn.download = `optimized_${selectedFile.name}`;
                downloadBtn.style.display = 'block';
                statusMessage.innerText = "Tối ưu thành công!";

            } catch (err) {
                console.error(err);
                statusMessage.innerText = "Lỗi: Trình duyệt điện thoại thiếu bộ nhớ RAM để chạy WASM.";
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
